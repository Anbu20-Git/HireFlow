version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
  build:
    commands:
      - chmod +x mvnw
      - chmod +x deployment/scripts/*.sh
      - ./mvnw clean package -DskipTests

artifacts:
  files:
    - target/hireflow-0.0.1-SNAPSHOT.jar
    - appspec.yml
    - deployment/scripts/*.sh